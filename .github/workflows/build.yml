name: Build Releases

on:
  release:
    types: [created]
  workflow_dispatch:

jobs:
  build-macos:
    runs-on: macos-13
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Install Dependencies
      run: |
        brew install vlc ffmpeg
        pip install pyinstaller requests mutagen vkpymusic python-vlc
        mkdir -p vlc_bundle/lib vlc_bundle/plugins ffmpeg
        cp -R /Applications/VLC.app/Contents/MacOS/lib/* vlc_bundle/lib/
        cp -R /Applications/VLC.app/Contents/MacOS/plugins/* vlc_bundle/plugins/
        cp $(brew --prefix ffmpeg)/bin/ffmpeg ffmpeg/
    - name: Build .app
      run: |
        pyinstaller --windowed --noconfirm --name "VKMusicDownloader" --icon AppIcon.icns --osx-bundle-identifier "com.suncho.vkmusic" --collect-all vkpymusic --add-data "vlc_bundle:vlc_bundle" --add-data "ffmpeg:ffmpeg" vk_music_mac.py
        codesign --force --deep --sign - "dist/VKMusicDownloader.app"
    - name: Create DMG
      run: hdiutil create -volname "VK Music Downloader" -srcfolder "dist/VKMusicDownloader.app" -ov -format UDZO "VKMusicDownloader.dmg"
    - name: Upload Release Asset
      uses: softprops/action-gh-release@v2
      with:
        files: VKMusicDownloader.dmg
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-windows:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Install Dependencies
      run: python -m pip install --upgrade pip && pip install pyinstaller requests mutagen vkpymusic python-vlc
    - name: Fetch ffmpeg (static build)
      shell: pwsh
      run: |
        Invoke-WebRequest -Uri "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip" -OutFile ffmpeg.zip
        Expand-Archive ffmpeg.zip -DestinationPath ffmpeg_tmp -Force
        $exe = Get-ChildItem ffmpeg_tmp -Recurse -Filter ffmpeg.exe | Select-Object -First 1
        if (-not $exe) { throw "ffmpeg.exe not found in archive" }
        New-Item -ItemType Directory -Force -Path ffmpeg | Out-Null
        Copy-Item $exe.FullName "ffmpeg\ffmpeg.exe"
    - name: Fetch VLC (portable)
      shell: pwsh
      run: |
        $index = Invoke-WebRequest -Uri "https://get.videolan.org/vlc/last/win64/" -UseBasicParsing
        $zip = $index.Links | Where-Object { $_.href -match '^vlc-.*-win64\.zip$' } | Select-Object -First 1
        if (-not $zip) { throw "VLC win64 zip not found on get.videolan.org" }
        Invoke-WebRequest -Uri ("https://get.videolan.org/vlc/last/win64/" + $zip.href) -OutFile vlc.zip
        Expand-Archive vlc.zip -DestinationPath vlc_tmp -Force
        $root = Get-ChildItem vlc_tmp -Directory | Select-Object -First 1
        Copy-Item -Recurse $root.FullName vlc_bundle
    - name: Build .exe
      shell: pwsh
      run: |
        pyinstaller --windowed --onedir --noconfirm --name "VKMusicDownloader" --icon AppIcon.ico --collect-all vkpymusic --add-data "vlc_bundle;vlc_bundle" --add-data "ffmpeg;ffmpeg" vk_music_win.py
        Compress-Archive -Path dist\VKMusicDownloader -DestinationPath VKMusicDownloader-Windows.zip -Force
    - name: Upload Release Asset
      uses: softprops/action-gh-release@v2
      with:
        files: VKMusicDownloader-Windows.zip
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
